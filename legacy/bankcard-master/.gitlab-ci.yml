Notify EMPBC PROD deploy readiness to MwT:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG'  # run on any tag creation
      when: manual
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  tags:
    - acsdocker 
  script:
    - echo "Tag detected ==> $CI_COMMIT_TAG"
